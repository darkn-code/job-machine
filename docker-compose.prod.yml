# PRODUCCIÓN (VPS).
#   cp .env.example .env   # y cambia TODAS las contraseñas/secret
#   Con CI/CD (normal):  el VPS NO compila; baja las imágenes que GitHub Actions publicó en GHCR
#                        (scripts/deploy.sh <tag>, lo llama el workflow). Ver docs/DEPLOY.md
#   Manual / sin CI:     docker compose -f docker-compose.prod.yml up -d --build
# No publica puertos: el nginx-proxy compartido del VPS (infra/proxy) entra por la red Docker
# externa `proxy` al alias `jobmachine-web`. Postgres y Django quedan en la red interna.
# Sin proxy (prueba local): añade `ports: ["8080:80"]` a `web` y crea la red: docker network create proxy
name: job-machine-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Postgres liviano para VPS chico (1-2 GB)
    command: postgres -c shared_buffers=64MB -c max_connections=30

  backend:
    image: ${IMAGE_REGISTRY:-local}/job-machine-backend:${IMAGE_TAG:-latest}
    build: ./web/backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: "0"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${IMAGE_REGISTRY:-local}/job-machine-web:${IMAGE_TAG:-latest}
    build: ./web/frontend
    restart: unless-stopped
    networks:
      default:
      proxy:
        aliases: [jobmachine-web]
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  proxy:
    external: true

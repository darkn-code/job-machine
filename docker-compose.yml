# DESARROLLO LOCAL (recarga en caliente).
#   docker compose up --build
#   Panel:  http://localhost:5173      API docs: http://localhost:8000/api/docs
# Producción (VPS): ver docker-compose.prod.yml
name: job-machine

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobmachine}
      POSTGRES_USER: ${POSTGRES_USER:-jobmachine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobmachine}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./web/backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-jobmachine}
      POSTGRES_USER: ${POSTGRES_USER:-jobmachine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobmachine}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-darkn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dragon123}
    volumes:
      - ./web/backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_BACKEND_URL: http://backend:8000
      VITE_POLLING: "1"
    volumes:
      - ./web/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:

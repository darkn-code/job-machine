# CI/CD de Job Machine
#   PR o push  -> secretos (gitleaks) + tests backend (Postgres) + typecheck/build frontend
#   push main  -> además: build de imágenes Docker -> GHCR (tags :<sha> y :latest)
#                 -> deploy al VPS por SSH (solo si la variable de repo DEPLOY_ENABLED = true)
# Configuración (secrets/vars) en docs/DEPLOY.md.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Gratis en cuentas personales; usa .gitleaks.toml de la raíz.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (Django tests)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobmachine
          POSTGRES_USER: jobmachine
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobmachine" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_HOST: localhost
      POSTGRES_DB: jobmachine
      POSTGRES_USER: jobmachine
      POSTGRES_PASSWORD: ci-only
    defaults:
      run:
        working-directory: web/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: Django check (deploy)
        run: python manage.py check --deploy --fail-level ERROR
      - name: Tests
        run: python manage.py test tracker -v 2

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  images:
    name: Imágenes Docker -> GHCR
    needs: [secrets-scan, backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: web/backend
          - name: web
            context: web/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Registro en minúsculas
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/job-machine-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/job-machine-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy al VPS
    needs: images
    # Apagado hasta que exista el VPS: Settings > Variables > DEPLOY_ENABLED = true
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Llave SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy (pull de imágenes + migraciones + healthcheck, rollback si falla)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # El token de GHCR viaja por stdin (no queda en la línea de comandos ni en logs)
          echo "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -p "${{ vars.VPS_PORT || 22 }}" \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "cd '${{ vars.VPS_APP_DIR || '/opt/job-machine' }}' && ./scripts/deploy.sh '${{ github.sha }}' '${{ github.actor }}'"

# Job Machine -> contenedor jobmachine-web (red `proxy`).
# FASE 1 (sin dominio): responde por IP en :80.
# FASE 2 (con dominio): ver infra/proxy/README.md (se cambia por jobmachine.ssl.conf.example).
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        set $upstream http://jobmachine-web:80;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
